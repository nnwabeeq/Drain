services:
  - type: web
    name: drain
    runtime: node
    plan: starter
    buildCommand: echo skip
    startCommand: node server.js
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_FILE
        value: /var/data/data.json
      - key: COOKIE_SECURE
        value: "1"
      - key: CREDITS_PER_USD
        value: "100"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: THRONE_URL
        sync: false
